services:
  - type: web
    name: ai-lead-qualifier
    runtime: node
    plan: standard
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.x"
      - key: DATABASE_URL
        fromDatabase:
          name: leadqualifier-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: leadqualifier-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: leadqualifier-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-url.com
      - key: APP_NAME
        value: AI Lead Qualifier
    healthCheckPath: /health

  - type: redis
    name: leadqualifier-redis
    plan: free
    ipAllowList: []

databases:
  - name: leadqualifier-db
    plan: free
    postgresMajorVersion: 15
